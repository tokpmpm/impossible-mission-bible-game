<title>保羅海難新手引導原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 版面：左側步驟清單｜中間一支手機｜右側「改了什麼」；手機寬度時三段直排。沿用遊戲本身的深藍＋暖金。 */
:root {
  --bg: #071327; --navy: #0b1d3a; --card: #13294d; --card2: #1b3262; --line: #2c4a7a;
  --gold: #f2c14e; --gold2: #ffd97a; --ink: #1b1400; --text: #f4f1e8; --muted: #a9b6cc; --red: #ff6b6b; --green: #6fd3a0;
  --f: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--f); font-size: 15px; line-height: 1.55; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--gold2); outline-offset: 2px; }
.wrap { display: grid; grid-template-columns: 230px minmax(0, 380px) minmax(0, 1fr); gap: 28px; max-width: 1180px; margin: 0 auto; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); align-items: start; }
header.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; }
header.top h1 { margin: 0; font-size: 22px; color: var(--gold); font-weight: 900; letter-spacing: .02em; }
header.top p { margin: 0; color: var(--muted); font-size: 14px; }
.steps { display: flex; flex-direction: column; gap: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.steps .grp { font-size: 12px; letter-spacing: .08em; color: var(--muted); margin: 10px 0 2px; }
.steps button { text-align: left; background: none; border: 1px solid transparent; border-radius: 10px; padding: 6px 10px; color: var(--muted); font-size: 14px; display: flex; gap: 8px; }
.steps button b { color: var(--gold); font-variant-numeric: tabular-nums; min-width: 1.6em; }
.steps button[aria-current="true"] { background: var(--card); border-color: var(--line); color: var(--text); }
.who { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.who button { border: 1px solid var(--line); background: var(--navy); border-radius: 999px; padding: 4px 10px; font-size: 13px; color: var(--muted); }
.who button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.phone { width: 100%; max-width: 380px; height: 760px; background: var(--navy); border: 2px solid var(--line); border-radius: 30px; overflow: hidden; display: flex; flex-direction: column; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
.scr { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
.scr > * { flex-shrink: 0; }
.ctrl { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
.ctrl button { border: 1px solid var(--line); background: var(--card); border-radius: 12px; min-height: 44px; padding: 0 18px; }
.notes { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
.notes h2 { margin: 0 0 4px; font-size: 18px; color: var(--gold); text-wrap: balance; }
.notes .fix { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.notes .fix span { font-size: 12px; border: 1px solid var(--gold); color: var(--gold); border-radius: 999px; padding: 1px 8px; }
.notes ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.notes .was { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); color: var(--muted); font-size: 14px; }
.notes .was b { color: var(--text); }
@media (max-width: 900px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  .steps { position: static; flex-direction: row; flex-wrap: wrap; }
  .steps .grp { width: 100%; }
  .steps button { padding: 4px 8px; font-size: 13px; }
  .phone { margin: 0 auto; height: 700px; }
}

/* ───── 遊戲內畫面 ───── */
.tb { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px 8px; background: #0a1a34; border-bottom: 1px solid var(--line); }
.tb .me { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tb .me b { font-size: 19px; color: var(--gold); white-space: nowrap; }
.tb .me span { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb .clock { font-weight: 900; font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tb .clock small { font-size: 12px; font-weight: 500; color: var(--muted); margin-right: 4px; }
.skybar { height: 10px; margin: 0 14px 6px; border-radius: 6px; background: linear-gradient(90deg, #0d1d45 0%, #2a3f7a 45%, #c77a5a 85%, #f5b35c 100%); position: relative; }
.skybar i { position: absolute; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: #ffe08a; box-shadow: 0 0 10px #ffd86b; left: 58%; animation: sun 30s linear infinite; }
@keyframes sun { from { left: 58%; } to { left: 66%; } }
.skycap { display: flex; justify-content: space-between; margin: 0 14px; font-size: 11px; color: var(--muted); }
.roster { display: flex; gap: 6px; overflow-x: auto; padding: 8px 14px; scrollbar-width: none; }
.roster span { flex: 0 0 auto; display: flex; align-items: center; gap: 4px; font-size: 13px; padding: 2px 8px 2px 3px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--muted); }
.roster span.hl { border-color: var(--gold); color: var(--text); }
.roster span.self { color: var(--gold); }
.body { padding: 4px 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.task { border: 2px solid var(--gold); border-radius: 16px; padding: 10px 14px 12px; background: linear-gradient(180deg, rgba(242,193,78,.14), rgba(242,193,78,.04)); }
.task .lbl { font-size: 12px; letter-spacing: .1em; color: var(--gold); font-weight: 700; }
.task p { margin: 2px 0 0; font-size: 19px; font-weight: 700; line-height: 1.45; }
.task p em { font-style: normal; color: var(--gold2); }
.sec { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.sec > summary, .sec > .sh { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; font-weight: 700; cursor: pointer; }
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary .r, .sec > .sh .r { font-weight: 500; color: var(--muted); font-size: 13px; }
.sec > summary, .sec > .sh { white-space: nowrap; }
.sec > summary .r, .sec > .sh .r { white-space: normal; text-align: right; }
.sec .in { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.clue { display: flex; gap: 10px; align-items: center; background: var(--navy); border-radius: 12px; padding: 8px 10px; }
.clue .pic { flex: 0 0 auto; display: flex; align-items: center; gap: 2px; }
.clue .t { font-weight: 700; font-size: 14px; display: flex; gap: 6px; align-items: center; }
.clue .t small { font-weight: 400; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 4px; }
.clue p { margin: 0; font-size: 14px; }
.more { font-size: 13px; color: var(--gold); padding: 2px 4px; background: none; border: none; text-align: left; }
.gauge { display: flex; align-items: center; gap: 8px; }
.gauge .cells { display: flex; flex-wrap: wrap; gap: 3px; flex: 1; }
.gauge .cells i { width: 13px; height: 13px; border-radius: 3px; background: var(--gold); }
.gauge .cells i.o { background: var(--red); }
.gauge b { font-size: 20px; font-variant-numeric: tabular-nums; }
.gauge .ov { color: var(--red); font-weight: 700; font-size: 14px; }
.needs { display: flex; flex-direction: column; gap: 4px; }
.needs .h { font-size: 12px; color: var(--muted); text-align: center; }
.needs .row { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; font-size: 13px; }
.needs .row div { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.needs small { color: var(--muted); font-size: 11px; }
.tray { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tray button { background: var(--navy); border: 2px solid var(--gold); border-radius: 12px; padding: 6px 2px 4px; display: flex; flex-direction: column; align-items: center; font-weight: 700; font-size: 13px; }
.tray button.off { border-color: var(--line); opacity: .5; }
.mini-scene { border-radius: 12px; overflow: hidden; height: 112px; }
.mini-scene .art-scene { height: 112px; width: 100%; object-fit: cover; }
.bar { margin-top: auto; padding: 10px 14px 14px; background: linear-gradient(180deg, rgba(11,29,58,0), var(--navy) 30%); position: sticky; bottom: 0; display: flex; flex-direction: column; gap: 6px; }
.bar .st { text-align: center; font-size: 13px; color: var(--muted); }
.bar .st strong { color: var(--gold); font-variant-numeric: tabular-nums; }
.big { min-height: 52px; border-radius: 16px; border: none; background: var(--gold); color: var(--ink); font-weight: 900; font-size: 18px; width: 100%; }
.big.dim { opacity: .45; }
.ghost { min-height: 44px; border-radius: 14px; border: 1px solid var(--line); background: transparent; color: var(--muted); }
.use { border: 2px solid var(--gold); border-radius: 14px; padding: 10px 12px; background: var(--card); display: flex; flex-direction: column; gap: 8px; }
.use .rule { font-weight: 700; color: var(--gold); }
.use .verse { font-size: 13px; color: var(--muted); border-left: 3px solid var(--gold); padding-left: 8px; }
/* 全螢幕段落 */
.full { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 20px 18px; justify-content: center; text-align: center; }
.full h2 { margin: 0; font-size: 26px; font-weight: 900; color: var(--gold); text-wrap: balance; }
.full p { margin: 0; font-size: 18px; line-height: 1.6; }
.full cite { font-style: normal; color: var(--gold); font-size: 14px; }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--gold); width: 22px; border-radius: 4px; }
.pbar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--gold); width: 0; animation: fill linear forwards; }
@keyframes fill { to { width: 100%; } }
.three { display: flex; justify-content: center; gap: 18px; }
.three div { display: flex; flex-direction: column; align-items: center; font-size: 14px; font-weight: 700; }
.rolecard { margin: 14px; border: 2px solid var(--gold); border-radius: 22px; padding: 18px 16px 16px; background: radial-gradient(120% 70% at 50% 0%, #22407a, var(--card) 70%); display: flex; flex-direction: column; gap: 10px; text-align: center; }
.rolecard .you { font-size: 15px; color: var(--muted); }
.rolecard h2 { margin: 0; font-size: 32px; font-weight: 900; color: var(--gold); line-height: 1.2; }
.rolecard .line { font-size: 21px; font-weight: 700; }
.rolecard .bib { font-size: 13px; color: var(--muted); }
.rolecard hr { border: none; border-top: 1px dashed var(--line); margin: 2px 0; width: 100%; }
.rolecard .k { font-size: 12px; letter-spacing: .08em; color: var(--muted); text-align: left; }
.fakebtn { border: 2px dashed var(--muted); border-radius: 14px; padding: 8px; color: var(--muted); font-weight: 700; display: flex; flex-direction: column; align-items: center; }
.fakebtn small { font-weight: 400; font-size: 12px; }
.secret { text-align: left; background: var(--navy); border-radius: 12px; padding: 8px 10px; font-size: 15px; }
.secret b { color: var(--gold2); }
.q { background: rgba(242,193,78,.12); border: 1px solid var(--gold); border-radius: 14px; padding: 10px; font-size: 17px; font-weight: 700; }
.q small { display: block; font-size: 12px; color: var(--gold); font-weight: 500; }
.row2 { display: flex; gap: 8px; }
.row2 > * { flex: 1; }
.turns { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.turns span { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.turns span.now { border-color: var(--gold); color: var(--gold); }
.turns span.done { opacity: .5; text-decoration: line-through; }
.dark { background: #03060d; }
.hold { border: 3px dashed var(--gold); border-radius: 18px; min-height: 180px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; color: var(--gold2); user-select: none; -webkit-user-select: none; touch-action: none; }
.hint { background: #10203c; border-radius: 14px; padding: 10px 12px; font-size: 16px; text-align: left; }
.hint b { color: var(--gold2); }
.toast { position: absolute; left: 12px; right: 12px; bottom: 16px; background: #fff3cf; color: var(--ink); border-radius: 14px; padding: 10px 12px; font-weight: 700; box-shadow: 0 8px 30px rgba(0,0,0,.5); animation: up .4s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.memory { text-align: center; display: flex; flex-direction: column; gap: 8px; }
.memory .who2 { font-size: 20px; font-weight: 900; }
.memory .qq { font-size: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--navy); border-radius: 999px; padding: 4px 12px; min-height: 36px; }
.chips button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); background: rgba(242,193,78,.12); }
.lobby-list { display: flex; flex-direction: column; gap: 4px; }
.lobby-list div { background: var(--navy); border-radius: 10px; padding: 6px 10px; display: flex; justify-content: space-between; font-size: 15px; }
.lobby-list div small { color: var(--muted); }
details.script { font-size: 14px; color: var(--muted); }
details.script summary { cursor: pointer; color: var(--gold); }
@media (prefers-reduced-motion: reduce) { .pbar i, .skybar i, .toast { animation: none; } .pbar i { width: 100%; } }
.looking { border: 1px dashed var(--gold); border-radius: 12px; padding: 8px 12px; font-size: 15px; }
.looking b { color: var(--gold2); }
.now { text-align: left; font-size: 17px; background: rgba(242,193,78,.14); border-radius: 12px; padding: 8px 10px; }
.now b { color: var(--gold); }
.fakebtn { transform: scale(.92); opacity: .8; }
.task .tip { font-size: 13px; color: var(--muted); margin-top: 4px; }
.hl-list > div { display: flex; gap: 8px; align-items: center; font-size: 14px; background: var(--navy); border-radius: 10px; padding: 6px 8px; }
.hl-list b { color: var(--gold2); }
.optlbl { align-self: center; font-size: 13px; font-weight: 700; color: var(--ink); background: var(--gold); border-radius: 999px; padding: 2px 12px; }
.who .optbtn { font-weight: 700; font-size: 15px; padding: 6px 16px; }
/* 第一關「保羅海難」插畫動畫（搭配 public/art.js）。
   原則：元素靜止時就是「最終狀態」，keyframes 只描述從哪裡來；
   所以 prefers-reduced-motion 關掉動畫後，畫面自然停在最終狀態。
   所有選擇器都限定在 .art（art.js 產生的 SVG）底下，不影響全域。 */

.art { display: inline-block; vertical-align: middle; overflow: visible; }
.art.art-scene,
.art.art-card,
.art.art-meal,
.art.art-landing { display: block; width: 100%; height: auto; max-width: 100%; overflow: hidden; }
.art.art-darkness { display: block; width: 100%; height: 100%; overflow: hidden; }
.art.art-scene { border-radius: 14px; }

/* ── 共用：浪往左流動（位移量＝波長，無縫循環） ── */
@keyframes art-drift-48 { from { transform: translateX(0); } to { transform: translateX(-48px); } }
@keyframes art-drift-60 { from { transform: translateX(0); } to { transform: translateX(-60px); } }
@keyframes art-drift-30 { from { transform: translateX(0); } to { transform: translateX(-30px); } }
.art .waves-back { animation: art-drift-48 7s linear infinite; }
.art .waves-front { animation: art-drift-60 5s linear infinite; }
.art.sky-storm .waves-back,
.art.sky-dark .waves-back { animation-duration: 3.2s; }
.art.sky-storm .waves-front,
.art.sky-dark .waves-front { animation-duration: 2.2s; }
.art .waves-landing { animation: art-drift-30 4s linear infinite; }

/* ── 船隨浪搖擺：calm 小、storm 大 ── */
.art .ship { transform-box: view-box; transform-origin: 180px 120px; }
@keyframes art-rock-calm {
  0%, 100% { transform: rotate(-1.2deg) translateY(0); }
  50% { transform: rotate(1.2deg) translateY(1.5px); }
}
@keyframes art-rock-storm {
  0%, 100% { transform: rotate(-4.5deg) translateY(-2px); }
  25% { transform: rotate(0deg) translateY(3px); }
  50% { transform: rotate(4.5deg) translateY(-1px); }
  75% { transform: rotate(0deg) translateY(3px); }
}
.art .rock-calm { animation: art-rock-calm 6s ease-in-out infinite; }
.art .rock-storm { animation: art-rock-storm 3.2s ease-in-out infinite; }

/* ── 天空：雲飄、雨、閃電 ── */
@keyframes art-clouds { from { transform: translateX(-8px); } to { transform: translateX(8px); } }
.art .clouds { animation: art-clouds 9s ease-in-out infinite alternate; }

@keyframes art-rain { from { transform: translate(0, 0); } to { transform: translate(-10px, 40px); } }
.art .rain { animation: art-rain 0.45s linear infinite; }
.art.sky-dark .rain { animation-duration: 0.6s; }

/* 偶爾閃電：大部分時間看不到，週期末閃兩下 */
@keyframes art-lightning {
  0%, 88%, 91%, 93.5%, 100% { opacity: 0; }
  89%, 92.5% { opacity: 1; }
}
.art .lightning { opacity: 0; animation: art-lightning 7s linear infinite 1.5s; }

/* 停電遮罩：很暗的閃電，更少出現 */
@keyframes art-dim-lightning {
  0%, 93%, 95%, 100% { opacity: 0; }
  94% { opacity: 1; }
}
.art .dim-lightning { animation: art-dim-lightning 11s linear infinite 3s; }

/* ── 漂浮的東西：半沉、隨浪上下 ── */
.art .bob { transform-box: fill-box; transform-origin: 50% 70%; animation: art-bob 2.6s ease-in-out infinite; }
.art .float-item:nth-of-type(2n) .bob { animation-delay: -1.1s; animation-duration: 3s; }
@keyframes art-bob {
  0%, 100% { transform: translateY(0) rotate(-7deg); }
  50% { transform: translateY(2.5px) rotate(7deg); }
}

/* ── 剛丟進海裡：沿拋物線從甲板飛到漂浮位置（約 0.8 秒）＋水花 ──
   外層管水平（等速）、內層管垂直（先上後下），合起來就是拋物線。
   --fx/--fy 是「甲板位置 − 漂浮位置」，終點是 0，所以靜止時就停在漂浮位置。 */
@keyframes art-fly-x { from { transform: translateX(var(--fx, 0px)); } to { transform: translateX(0); } }
@keyframes art-fly-y {
  0% { transform: translateY(var(--fy, 0px)); animation-timing-function: cubic-bezier(0.2, 0.7, 0.4, 1); }
  35% { transform: translateY(calc(var(--fy, 0px) - 30px)); animation-timing-function: cubic-bezier(0.6, 0, 0.9, 0.5); }
  100% { transform: translateY(0); }
}
.art .just-thrown { animation: art-fly-x 0.8s linear both; }
.art .just-thrown .jt-y { animation: art-fly-y 0.8s both; }
.art .appear-late { animation: art-appear-late 0.8s linear both; }
@keyframes art-appear-late { 0%, 80% { opacity: 0; } 100% { opacity: 1; } }

.art .splash > g { transform-box: fill-box; transform-origin: 50% 100%; }
.art .splash { animation: art-splash-fade 1.1s ease-out both; }
.art .splash > g { animation: art-splash-grow 1.1s ease-out both; }
@keyframes art-splash-fade {
  0%, 65% { opacity: 0; }
  75% { opacity: 1; }
  100% { opacity: 0; }
}
@keyframes art-splash-grow {
  0%, 65% { transform: scale(0.3); }
  85% { transform: scale(1); }
  100% { transform: scale(1.15); }
}
/* 單獨使用的水花圖 */
.art.art-splash .splash { animation-duration: 0.6s; animation-name: art-splash-solo; }
.art.art-splash .splash > g { animation-duration: 0.6s; animation-name: art-splash-solo-grow; }
@keyframes art-splash-solo { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0; } }
@keyframes art-splash-solo-grow { 0% { transform: scale(0.3); } 60% { transform: scale(1); } 100% { transform: scale(1.15); } }

/* ── 剛撈回：從海面跳回甲板 ── */
.art .just-rescued { animation: art-fly-x 0.7s ease-out both; }
.art .just-rescued .jr-y { animation: art-hop-y 0.7s both; }
@keyframes art-hop-y {
  0% { transform: translateY(var(--fy, 0px)); animation-timing-function: cubic-bezier(0.2, 0.7, 0.4, 1); }
  55% { transform: translateY(-22px); animation-timing-function: cubic-bezier(0.6, 0, 0.9, 0.5); }
  100% { transform: translateY(0); }
}

/* ── 超重：甲板上的海水晃動、警告三角閃爍 ── */
.art .deck-water { animation: art-slosh 1.4s ease-in-out infinite alternate; }
@keyframes art-slosh { from { opacity: 0.6; transform: translateX(-2px); } to { opacity: 1; transform: translateX(2px); } }
.art .overload-warn { animation: art-warn 1s ease-in-out infinite alternate; }
@keyframes art-warn { from { opacity: 0.65; } to { opacity: 1; } }

/* ── 上岸三件事：亮起時發一次光 ── */
.art.need-lit { animation: art-need-lit 0.9s ease-out 1; transform-origin: 50% 50%; }
@keyframes art-need-lit {
  0% { transform: scale(0.7); filter: drop-shadow(0 0 0 rgba(242, 193, 78, 0)); }
  45% { transform: scale(1.22); filter: drop-shadow(0 0 10px rgba(255, 217, 122, 0.95)); }
  100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(242, 193, 78, 0)); }
}

/* 故事卡：風線輕輕流動 */
.art .card-wind { stroke-dasharray: 60 14; animation: art-card-wind 1.6s linear infinite; }
@keyframes art-card-wind { from { stroke-dashoffset: 74; } to { stroke-dashoffset: 0; } }

/* ── 吃飯（擘餅）：約 2.5 秒 ── */
.art-meal .meal-hands { animation: art-meal-hands 0.4s ease-out both; }
@keyframes art-meal-hands { from { opacity: 0; transform: translateY(12px); } }
.art-meal .meal-half { transform-box: view-box; transform-origin: 120px 100px; }
.art-meal .meal-half-l { transform: translate(-9px, 1px) rotate(-9deg); animation: art-meal-break-l 0.6s ease-out 0.4s both; }
.art-meal .meal-half-r { transform: translate(9px, 1px) rotate(9deg); animation: art-meal-break-r 0.6s ease-out 0.4s both; }
@keyframes art-meal-break-l { from { transform: none; } }
@keyframes art-meal-break-r { from { transform: none; } }
.art-meal .meal-crumb { animation: art-meal-crumb 0.6s ease-out both; }
@keyframes art-meal-crumb { from { opacity: 0; transform: translate(var(--cx, 0px), var(--cy, 0px)); } }
.art-meal .meal-head { transform-box: fill-box; transform-origin: center; animation: art-meal-head 0.45s ease-out both; }
@keyframes art-meal-head { from { opacity: 0.22; transform: scale(0.8); } 60% { opacity: 1; transform: scale(1.15); } }

/* ── 上岸：約 4 秒 ── */
/* 船駛向沙灘，45% 撞上沙洲，船頭卡住 */
.art-landing .land-ship { transform-box: view-box; transform-origin: 226px 150px; animation: art-land-ship 4s both; }
@keyframes art-land-ship {
  0% { transform: translate(-170px, -10px); animation-timing-function: ease-out; }
  44% { transform: translate(-4px, 0); }
  48% { transform: translate(2px, 0) rotate(3deg); }
  54% { transform: rotate(-2deg); }
  60% { transform: rotate(1deg); }
  100% { transform: none; }
}
/* 船尾在擱淺後被浪打壞：完整船尾消失，碎木板散開 */
.art-landing .stern-intact { animation: art-land-stern 4s both; }
@keyframes art-land-stern { 0%, 52% { opacity: 1; } 56%, 100% { opacity: 0; } }
.art-landing .land-debris { animation: art-land-debris 4s ease-out both; }
@keyframes art-land-debris {
  0%, 52% { opacity: 0; transform: translate(var(--dx, 0px), var(--dy, 0px)); }
  56% { opacity: 1; }
  100% { transform: none; }
}
.art-landing .land-splash { animation: art-land-splash 4s ease-out both; }
.art-landing .land-splash > g { transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes art-land-splash { 0%, 46% { opacity: 0; } 52% { opacity: 1; } 66%, 100% { opacity: 0; } }

/* 人：從船邊的水裡（橫躺＝游水／抱著木板）一路漂到岸上站起來。沒有人往下沉。 */
.art-landing .land-person { transform-box: fill-box; transform-origin: 50% 70%; animation: art-land-swim 4s both; }
.art-landing .land-person.slow { animation-name: art-land-swim-slow; }
@keyframes art-land-swim {
  0%, 52% { opacity: 0; transform: translate(var(--sx), var(--sy)) rotate(-80deg); }
  57% { opacity: 1; transform: translate(var(--sx), var(--sy)) rotate(-80deg); }
  80% { transform: translate(calc(var(--sx) * 0.12), calc(var(--sy) * 0.12)) rotate(-80deg); }
  90%, 100% { opacity: 1; transform: none; }
}
@keyframes art-land-swim-slow {
  0%, 52% { opacity: 0; transform: translate(var(--sx), var(--sy)) rotate(-80deg); }
  57% { opacity: 1; transform: translate(var(--sx), var(--sy)) rotate(-80deg); }
  70% { transform: translate(calc(var(--sx) * 0.7), calc(var(--sy) * 0.7)) rotate(-80deg); }
  90% { transform: translate(calc(var(--sx) * 0.1), calc(var(--sy) * 0.1)) rotate(-80deg); }
  97%, 100% { opacity: 1; transform: none; }
}
/* 岸上生起一堆火（28:2） */
.art-landing .land-fire { transform-box: fill-box; transform-origin: 50% 100%; animation: art-land-fire 4s ease-out both; }
@keyframes art-land-fire { 0%, 86% { opacity: 0; transform: scale(0.2); } 100% { opacity: 1; transform: none; } }
.art-landing .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: art-flicker 0.7s ease-in-out 4s infinite alternate; }
@keyframes art-flicker { from { transform: scale(1, 1); } to { transform: scale(0.92, 1.1); } }

/* ── 減少動態：全部停住，停在最終狀態 ── */
@media (prefers-reduced-motion: reduce) {
  .art,
  .art * {
    animation: none !important;
    transition: none !important;
  }
}

/* ───── 拋錨、捆船底（2026-11-16 三種用掉） ───── */
.art.art-use { display: block; max-width: 360px; margin: 0 auto; }
.art-anchor .ad-anchor, .art-anchor .ad-rope { animation: art-anchor-drop 0.9s ease-in both; }
@keyframes art-anchor-drop { from { transform: translateY(-46px); opacity: 0; } }
.art-undergird .ug-loop { animation: art-ug-loop 0.7s ease-out both; }
@keyframes art-ug-loop { from { opacity: 0; transform: scaleY(0.2); } }
.art-undergird .ug-loop { transform-box: fill-box; transform-origin: 50% 0; }

</style>

</div>

<script>
const A = (function () {
// 第一關「保羅海難」（使徒行傳 27 章）的插畫與動畫。
// 全部是純函式，回傳 SVG 字串，可直接塞進 innerHTML；不碰 DOM、零依賴、不用外部圖庫。
// 動畫全部寫在 art.css（keyframes＋class），這裡只負責畫圖與掛 class。
//
// 動畫設計原則：每個會動的元素，「靜止時」的樣子就是動畫的最終狀態，
// keyframes 只描述「從哪裡來」。所以 prefers-reduced-motion 把 animation 關掉時，
// 畫面自然停在最終狀態（東西已漂在海上、人都上了岸、火已生起）。
//
// 注意：會被 CSS 動畫改 transform 的 <g>，絕對不放 transform 屬性（CSS 會蓋掉它），
// 位置一律交給外層或內層另一個 <g transform="...">。

// ───────────────────────── 色彩 ─────────────────────────
const C = {
  navy: '#0b1d3a',
  card: '#13294d',
  card2: '#1b3262',
  gold: '#f2c14e',
  gold2: '#ffd97a',
  goldDeep: '#c9932a',
  ink: '#2a1d00',
  text: '#f4f1e8',
  muted: '#b5c0d9',
  grey: '#8592ad',
  wood: '#9a6337',
  woodDark: '#6b3f1f',
  woodLight: '#c48a52',
  sail: '#efe6d0',
  steel: '#b4c2d4',
  steelDark: '#5d6e86',
  rope: '#d9b37a',
  sack: '#c8a06a',
  bread: '#e3a24f',
  sea: '#1f6696',
  seaDark: '#123f66',
  foam: '#dceefa',
  red: '#ff6b6b',
  sand: '#e9cf96',
};

// 統一的深色描邊，讓圖示在深色背景與木頭甲板上都清楚
const INK = `stroke="${C.ink}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"`;

// 同一頁可能有多個 SVG：漸層等 id 加流水號避免互相干擾
let uidSeq = 0;
const uid = (p) => `art-${p}-${++uidSeq}`;

const esc = (s) =>
  String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);

/** 帶深色外框的粗線（先畫深色粗線，再畫彩色細線），適合錨、繩子等線狀物。 */
function ol(d, color, w = 3, extra = '') {
  return (
    `<path d="${d}" fill="none" stroke="${C.ink}" stroke-width="${w + 2.4}" stroke-linecap="round" stroke-linejoin="round"/>` +
    `<path d="${d}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`
  );
}

function svgOpen({ viewBox, size, label, cls = '', extra = '' }) {
  const dims = size ? `width="${size}" height="${size}"` : 'width="100%"';
  return `<svg xmlns="http://www.w3.org/2000/svg" class="art ${cls}" viewBox="${viewBox}" ${dims} role="img" aria-label="${esc(label)}" ${extra}>`;
}

// ───────────────────────── 1. 船上的東西 ─────────────────────────
// 座標都在 40×40 的方格內。

const ITEM_ORDER = ['糧食', '纜索', '錨', '麥子', '器具', '小船'];

const ITEM_LABEL = {
  糧食: '糧食：一袋糧食和一個餅',
  纜索: '纜索：一捆繩子',
  錨: '錨',
  麥子: '麥子：麥穗和貨袋',
  器具: '器具：帆、滑輪和索具',
  小船: '小船：一艘小艇',
};

function anchorShape(color = C.steel, w = 3) {
  return (
    ol('M20 11 L20 34', color, w) +
    ol('M12 15 L28 15', color, w) +
    ol('M8 24 Q10 34 20 35 Q30 34 32 24', color, w) +
    `<path d="M5 26 L9 20 L12 27 Z" fill="${color}" ${INK}/>` +
    `<path d="M35 26 L31 20 L28 27 Z" fill="${color}" ${INK}/>` +
    `<circle cx="20" cy="7.5" r="3.6" fill="none" stroke="${C.ink}" stroke-width="${w + 2.4}"/>` +
    `<circle cx="20" cy="7.5" r="3.6" fill="none" stroke="${color}" stroke-width="${w}"/>`
  );
}

function crateShape() {
  return (
    `<rect x="6" y="10" width="28" height="24" rx="2.5" fill="${C.woodLight}" ${INK}/>` +
    `<path d="M6 18 H34 M6 26 H34" stroke="${C.woodDark}" stroke-width="1.2"/>` +
    `<path d="M8 12 L32 32 M32 12 L8 32" stroke="${C.woodDark}" stroke-width="2.2" stroke-linecap="round"/>` +
    `<rect x="6" y="10" width="28" height="24" rx="2.5" fill="none" ${INK}/>`
  );
}

function itemArt(id) {
  switch (id) {
    case '糧食':
      return (
        // 麻袋
        `<path d="M9 14 Q8 10 12 10 L23 10 Q27 10 26 14 L28 30 Q28 35 23 35 L11 35 Q6 35 7 30 Z" fill="${C.sack}" ${INK}/>` +
        `<path d="M13 8 Q17.5 3 22 8 L21 11 L14 11 Z" fill="${C.sack}" ${INK}/>` +
        `<path d="M11 12.5 Q17.5 15 24 12.5" fill="none" stroke="${C.woodDark}" stroke-width="1.8" stroke-linecap="round"/>` +
        `<path d="M11 21 l3 0 M19 25 l3 0 M12 29 l3 0" stroke="${C.woodDark}" stroke-width="1" stroke-linecap="round"/>` +
        // 餅
        `<ellipse cx="26" cy="29" rx="11" ry="7" fill="${C.bread}" ${INK}/>` +
        `<ellipse cx="26" cy="27.5" rx="8" ry="4" fill="#f0bd6c"/>` +
        `<path d="M20.5 28 l2.5 -3 M25.5 28.5 l2.5 -3.5 M30.5 28.5 l2 -3" stroke="${C.ink}" stroke-width="1.3" stroke-linecap="round"/>`
      );
    case '纜索':
      return (
        `<ellipse cx="19" cy="24" rx="15" ry="10.5" fill="${C.rope}" ${INK}/>` +
        `<ellipse cx="19" cy="23.2" rx="10.5" ry="7" fill="none" stroke="${C.ink}" stroke-width="1.2"/>` +
        `<ellipse cx="19" cy="22.6" rx="6" ry="3.8" fill="#6b4a22" ${INK}/>` +
        // 繩子的扭紋
        `<path d="M7 20 l2 2 M10 15.5 l1.5 2.2 M16 13.6 l0.8 2.4 M23 13.8 l-0.6 2.4 M29 16 l-1.5 2 M32 21 l-2 1.5 M9 29 l2 -1.6 M15 32.5 l1 -2.2 M23 32.5 l-0.8 -2.2 M29.5 29.5 l-2 -1.6" stroke="${C.woodDark}" stroke-width="1.1" stroke-linecap="round"/>` +
        // 鬆開的繩頭
        ol('M32 27 Q38 31 34 37', C.rope, 3)
      );
    case '錨':
      return anchorShape();
    case '麥子':
      return (
        // 麥穗從袋口冒出
        ol('M20 14 L15 3', '#d9a83a', 1.4) +
        ol('M20 14 L20 2', '#d9a83a', 1.4) +
        ol('M20 14 L25 3', '#d9a83a', 1.4) +
        [
          [15.5, 4.5, -25],
          [16.8, 7.4, -25],
          [20, 3.2, 0],
          [20, 6.4, 0],
          [24.5, 4.5, 25],
          [23.2, 7.4, 25],
        ]
          .map(
            ([x, y, r]) =>
              `<ellipse cx="${x}" cy="${y}" rx="1.9" ry="3" transform="rotate(${r} ${x} ${y})" fill="${C.gold}" stroke="${C.ink}" stroke-width="0.9"/>`,
          )
          .join('') +
        // 貨袋
        `<path d="M8 17 Q8 13 12 13 L28 13 Q32 13 32 17 L33 32 Q33 36 29 36 L11 36 Q7 36 7 32 Z" fill="#eadcae" ${INK}/>` +
        `<path d="M10 15.5 Q20 18 30 15.5" fill="none" stroke="${C.woodDark}" stroke-width="1.6"/>` +
        // 袋上的麥穗印記
        `<path d="M20 33 L20 21 M20 24 l-3 -2.5 M20 24 l3 -2.5 M20 28 l-3 -2.5 M20 28 l3 -2.5" stroke="${C.goldDeep}" stroke-width="1.6" stroke-linecap="round" fill="none"/>`
      );
    case '器具':
      return (
        // 桅桿＋帆
        ol('M12 4 L12 37', C.woodLight, 2.4) +
        `<path d="M14.5 6 L14.5 31 L33 31 Z" fill="${C.sail}" ${INK}/>` +
        `<path d="M14.5 14 L22 31 M14.5 22 L27 31" stroke="#cbbf9f" stroke-width="1"/>` +
        // 滑輪＋索具
        ol('M12 6 L30 9', C.rope, 1.4) +
        `<rect x="26.5" y="6.5" width="7" height="9" rx="3" fill="${C.woodLight}" ${INK}/>` +
        `<circle cx="30" cy="11" r="2" fill="${C.steelDark}" stroke="${C.ink}" stroke-width="1"/>` +
        ol('M31.5 15.5 L35 31', C.rope, 1.4) +
        ol('M5 37 L35 37', C.woodDark, 2)
      );
    case '小船':
      return (
        // 槳
        ol('M9 9 L29 29', C.woodLight, 2) +
        `<ellipse cx="31.5" cy="31.5" rx="2.6" ry="5" transform="rotate(-45 31.5 31.5)" fill="${C.woodLight}" ${INK}/>` +
        // 小艇
        `<path d="M3 20 L37 20 Q34 32 25 33 L15 33 Q6 32 3 20 Z" fill="#b5713f" ${INK}/>` +
        `<path d="M5.5 25 Q20 27 35 25" fill="none" stroke="${C.woodDark}" stroke-width="1.2"/>` +
        `<path d="M3 20 L37 20" stroke="${C.woodLight}" stroke-width="2.4" stroke-linecap="round"/>` +
        `<path d="M3 20 L37 20 Q34 32 25 33 L15 33 Q6 32 3 20 Z" fill="none" ${INK}/>`
      );
    default:
      return crateShape();
  }
}

/** 船上的東西圖示。未知 id 畫一個箱子。 */
function item(id, size = 40) {
  const label = ITEM_LABEL[id] || `箱子：${id ?? '未知的東西'}`;
  return `${svgOpen({ viewBox: '0 0 40 40', size, label, cls: 'art-item', extra: `data-item="${esc(id ?? '')}"` })}${itemArt(id)}</svg>`;
}

// ───────────────────────── 2. 上岸三件事 ─────────────────────────

function needArt(id, lit) {
  // 亮：金色實心＋深色描邊；不亮：空心、灰色虛線輪廓（形狀相同，不只靠顏色）
  const f = (light) => (lit ? (light ? C.gold2 : C.gold) : 'none');
  const s = lit
    ? `stroke="${C.ink}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"`
    : `stroke="${C.grey}" stroke-width="1.8" stroke-dasharray="3 2.2" stroke-linejoin="round" stroke-linecap="round"`;
  const line = lit ? C.ink : C.grey;
  switch (id) {
    case '力氣':
      return (
        `<ellipse cx="20" cy="24" rx="15" ry="10" fill="${f(false)}" ${s}/>` +
        `<path d="M8 21 Q20 9 32 21" fill="${f(true)}" ${s}/>` +
        `<path d="M13 22 l3 -4 M19 21 l3 -4.5 M25 22 l3 -4" stroke="${line}" stroke-width="1.6" stroke-linecap="round"/>`
      );
    case '船身':
      return (
        `<path d="M3 15 L37 15 Q35 30 23 32 L17 32 Q5 30 3 15 Z" fill="${f(false)}" ${s}/>` +
        `<path d="M3 15 L37 15" stroke="${line}" stroke-width="2.2" stroke-linecap="round"/>` +
        // 兩道繩子繞過船底
        `<path d="M12 11 Q11 24 14 33" fill="none" stroke="${lit ? C.ink : C.grey}" stroke-width="${lit ? 4.6 : 3}" stroke-linecap="round"/>` +
        `<path d="M27 11 Q28 24 25 33" fill="none" stroke="${lit ? C.ink : C.grey}" stroke-width="${lit ? 4.6 : 3}" stroke-linecap="round"/>` +
        (lit
          ? `<path d="M12 11 Q11 24 14 33 M27 11 Q28 24 25 33" fill="none" stroke="${C.rope}" stroke-width="2.4" stroke-dasharray="2 1.4" stroke-linecap="round"/>`
          : '')
      );
    case '天亮':
      return (
        // 日出（太陽＋光芒）
        `<path d="M11 24 A9 9 0 0 1 29 24 Z" fill="${f(true)}" ${s}/>` +
        `<path d="M20 9 L20 12 M9 14 L11 16 M31 14 L29 16 M5 21 L8 21.5 M35 21 L32 21.5" stroke="${line}" stroke-width="1.8" stroke-linecap="round"/>` +
        `<path d="M3 24 L37 24" stroke="${line}" stroke-width="2" stroke-linecap="round"/>` +
        // 小錨
        `<g transform="translate(13.5 25) scale(0.34)">` +
        `<path d="M20 4 L20 34 M12 13 L28 13 M7 24 Q10 35 20 36 Q30 35 33 24" fill="none" stroke="${lit ? C.ink : C.grey}" stroke-width="${lit ? 6 : 5}" stroke-linecap="round"/>` +
        (lit ? `<path d="M20 4 L20 34 M12 13 L28 13 M7 24 Q10 35 20 36 Q30 35 33 24" fill="none" stroke="${C.gold}" stroke-width="3" stroke-linecap="round"/>` : '') +
        `</g>`
      );
    default:
      return `<circle cx="20" cy="20" r="13" fill="${f(false)}" ${s}/>`;
  }
}

const NEED_LABEL = { 力氣: '大家有力氣（餅）', 船身: '船身撐得住（纜索捆綁船身）', 天亮: '平安等到天亮（錨與日出）' };

/** 上岸三件事圖示。lit=true 金色實心並帶 class need-lit。 */
function need(id, lit, size = 40) {
  const label = `${NEED_LABEL[id] || id}：${lit ? '已顧好' : '還沒顧好'}`;
  const cls = `art-need ${lit ? 'need-lit' : 'need-off'}`;
  return `${svgOpen({ viewBox: '0 0 40 40', size, label, cls, extra: `data-need="${esc(id)}"` })}${needArt(id, !!lit)}</svg>`;
}

// ───────────────────────── 3. 職能圖示 ─────────────────────────
// 32×32，外圈一個圓形徽章，讓所有職能圖示風格一致、在任何底色上都清楚。

const ROLE_LABEL = {
  nav: '船長（舵輪）',
  supply: '管倉（木箱）',
  comms: '伙房（湯鍋）',
  eng: '木匠（槌子）',
  medic: '醫生（藥袋）',
  observer: '瞭望（望遠鏡）',
  scout: '測水深（鉛錘繩）',
  liaison: '船主（錢袋）',
  store: '水手長（繩結）',
  backup: '舵手（羅盤）',
};

function roleArt(id) {
  switch (id) {
    case 'nav': {
      let spokes = '';
      for (let i = 0; i < 8; i++) {
        const a = (i * Math.PI) / 4;
        const x1 = 16 + Math.cos(a) * 2.5;
        const y1 = 16 + Math.sin(a) * 2.5;
        const x2 = 16 + Math.cos(a) * 10.2;
        const y2 = 16 + Math.sin(a) * 10.2;
        spokes += `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="${C.gold}" stroke-width="1.8" stroke-linecap="round"/>`;

/**
 * 簡單剪影小人，腳底在 (x, y)，身高 h。不畫臉。
 * opt.raise：舉起一隻手（勸阻）；opt.helmet：頭頂羽冠（百夫長）
 */
function person(x, y, h, color, opt = {}) {
  const r = h * 0.14;
  const hy = y - h + r;
  const top = hy + r + h * 0.04;
  const sw = h * 0.2;
  const bw = h * 0.24;
  let s = '';
  if (opt.raise) {
    const dir = opt.raise === 'left' ? -1 : 1;
    s += `<path d="M${x + dir * sw * 0.6} ${top + h * 0.08} L${x + dir * sw * 1.4} ${top - h * 0.22}" stroke="${color}" stroke-width="${h * 0.09}" stroke-linecap="round"/>`;
    s += `<circle cx="${x + dir * sw * 1.45}" cy="${top - h * 0.26}" r="${h * 0.065}" fill="${color}"/>`;
  }
  if (opt.helmet) {
    s += `<path d="M${x - r * 0.9} ${hy - r * 0.6} Q${x} ${hy - r * 2.4} ${x + r * 0.9} ${hy - r * 0.6} Z" fill="${opt.helmet}"/>`;
  }
  s += `<circle cx="${x}" cy="${hy}" r="${r}" fill="${color}"/>`;
  s += `<path d="M${x - sw} ${top + h * 0.06} Q${x - sw} ${top} ${x - sw * 0.6} ${top} L${x + sw * 0.6} ${top} Q${x + sw} ${top} ${x + sw} ${top + h * 0.06} L${x + bw} ${y} L${x - bw} ${y} Z" fill="${color}"/>`;
  return `<g class="person">${s}</g>`;
}

/** 頭＋肩的小人頭像（用於很多人的畫面）。 */
function bust(x, y, r, color, extra = '') {
  x = +x; y = +y; r = +r;
  const f = (v) => +v.toFixed(2);
  return `<g ${extra}><circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="${color}"/><path d="M${f(x - r * 1.6)} ${f(y + r * 2.6)} Q${f(x - r * 1.6)} ${f(y + r * 1.15)} ${f(x)} ${f(y + r * 1.15)} Q${f(x + r * 1.6)} ${f(y + r * 1.15)} ${f(x + r * 1.6)} ${f(y + r * 2.6)} Z" fill="${color}"/></g>`;
}

/** 一般的船身（側面，船頭朝右），局部座標：甲板 y=0、寬 0~w。 */
function simpleHull(w, h, fill = C.wood) {
  return (
    `<path d="M0 -6 L8 0 L${w - 12} 0 L${w} -10 Q${w - 4} ${h * 0.7} ${w - 26} ${h} L22 ${h} Q4 ${h * 0.8} 0 -6 Z" fill="${fill}" ${INK}/>` +
    `<path d="M6 ${h * 0.35} Q${w / 2} ${h * 0.42} ${w - 6} ${h * 0.25}" fill="none" stroke="${C.woodDark}" stroke-width="1.2"/>` +
    `<path d="M14 ${h * 0.7} Q${w / 2} ${h * 0.78} ${w - 20} ${h * 0.62}" fill="none" stroke="${C.woodDark}" stroke-width="1.2"/>`
  );
}

/** 水平方向重複的波浪路徑（往下封閉到 bottom，可當海面填色）。 */
function wavePath(y, amp, period, x0, x1, bottom) {
  let d = `M${x0} ${y}`;
  d += ` q${period / 4} ${-amp} ${period / 2} 0`;
  for (let x = x0 + period / 2; x < x1; x += period / 2) d += ` t${period / 2} 0`;
  if (bottom != null) d += ` L${x1 + period} ${bottom} L${x0} ${bottom} Z`;
  return d;
}

/** 斜雨。用格狀排列，往 (-10, 40) 平移一格就無縫循環。 */
function rain(w, h, color, opacity, cls = 'rain') {
  let s = '';
  const rows = Math.ceil(h / 40) + 2;
  const cols = Math.ceil(w / 18) + 4;
  for (let j = -1; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const jitter = ((i * 37) % 23) - 11; // 只跟 i 有關，平移一列仍無縫
      const x = 18 * i - 10 * j + (j % 2 ? 0 : 0);
      const y = 40 * j + jitter;
      s += `M${x} ${y} l-3 12 `;
    }
  }
  return `<g class="${cls}" opacity="${opacity}"><path d="${s}" stroke="${color}" stroke-width="1.1" stroke-linecap="round"/></g>`;
}

function lightningBolt(x, y, s = 1, cls = 'lightning') {
  return (
    `<g class="${cls}">` +
    `<rect x="-20" y="-20" width="400" height="300" fill="#e8e4ff" opacity="0.18"/>` +
    `<path transform="translate(${x} ${y}) scale(${s})" d="M0 0 L-8 22 L-2 22 L-10 44 L8 16 L1 16 L8 0 Z" fill="#fff8d6" stroke="#cfc6ff" stroke-width="1"/>` +
    `</g>`
  );
}

const DECK_Y = 100; // 甲板（船的局部座標）

        `</g>` +
        `<g fill="#b8574a"><path d="M6 108 L15 101 L24 108 Z"/><path d="M24 104 L32 97 L40 104 Z"/><path d="M40 110 L50 103 L60 110 Z"/></g>` +

        `<rect x="0" y="120" width="120" height="6" fill="#8b7355"/>` +
        // 海鷗
        `<path d="M150 50 q4 -4 8 0 q4 -4 8 0 M178 64 q3 -3 6 0 q3 -3 6 0" fill="none" stroke="#3d4f6b" stroke-width="1.4" stroke-linecap="round"/>`
      );
    case 'storm':
      return (
        grad('#28233c', '#4c4566', '#5b5470') +

        cloud(220, 8, 1.7, '#3a3452') +

function deckItem(id, dyShip, rescued) {
  const x = DECK_X[id];
  const s = DECK_SCALE;
  const tx = x - 20 * s;
  const ty = DECK_Y - 40 * s - 0.5;
  let inner = `<g transform="translate(${tx} ${ty}) scale(${s})">${itemArt(id)}</g>`;
  if (rescued) {
    // 從漂浮位置跳回：offset＝漂浮中心 −（甲板中心＋船的吃水位移）
    const [fx, fy] = FLOAT_POS[id];
    const dx = (fx - x).toFixed(1);
    const dy = (fy - (DECK_Y - 20 * s + dyShip)).toFixed(1);
    inner = `<g class="just-rescued" style="--fx:${dx}px"><g class="jr-y" style="--fy:${dy}px">${inner}</g></g>`;
  }
  return `<g class="deck-item" data-item="${esc(id)}">${inner}</g>`;
}

function floatItem(id, dyShip, thrown) {
  const [cx, cy] = FLOAT_POS[id] || [180, 176];
  const s = FLOAT_SCALE;
  const half = 20 * s;
  let body = `<g transform="translate(${cx - half} ${cy - half - 3})"><g class="bob"><g transform="scale(${s})">${itemArt(id)}</g></g></g>`;
  if (thrown) {
    const dx = ((DECK_X[id] ?? 180) - cx).toFixed(1);
    const dy = (DECK_Y - 20 * DECK_SCALE + dyShip - cy).toFixed(1);
    body = `<g class="just-thrown" style="--fx:${dx}px"><g class="jt-y" style="--fy:${dy}px">${body}</g></g>`;
  }
  // 蓋在東西下半部的一小片海水，看起來半沉
  const cap = `<g class="float-cap${thrown ? ' appear-late' : ''}"><path d="${wavePath(cy + 1, 1.6, 8, cx - 13, cx + 9, cy + 10)}" fill="${C.sea}" opacity="0.9"/><path d="${wavePath(cy + 1, 1.6, 8, cx - 13, cx + 9)}" fill="none" stroke="${C.foam}" stroke-width="1" opacity="0.8"/></g>`;
  const splash = thrown ? splashArt(cx, cy, 'splash') : '';
  return `<g class="float-item" data-item="${esc(id)}">${body}${cap}${splash}</g>`;
}

function splashArt(cx, cy, cls) {
  return (
    `<g class="${cls}" opacity="0"><g transform="translate(${cx} ${cy})">` +
    `<path d="M-2 -2 L-8 -16 M2 -3 L2 -20 M5 -2 L12 -15 M-6 0 L-16 -6 M8 0 L18 -6" stroke="${C.foam}" stroke-width="2.4" stroke-linecap="round"/>` +
    `<circle cx="-10" cy="-19" r="1.8" fill="${C.foam}"/><circle cx="14" cy="-18" r="1.8" fill="${C.foam}"/><circle cx="2" cy="-24" r="2" fill="${C.foam}"/>` +
    `<ellipse cx="0" cy="2" rx="12" ry="3" fill="none" stroke="${C.foam}" stroke-width="1.6"/>` +
    `</g></g>`
  );
}

/** 依載重算船的上下位移：越重越低，超過上限明顯下沉。 */
function draftOffset(weight, cap) {
  const w = Math.max(0, Number(weight) || 0);
  const c = Number(cap) > 0 ? Number(cap) : 6;
  const r = w / c;
  if (r <= 1) return -10 + 16 * r; // 安全：金線在海面上方 0~16
  return Math.min(22, 10 + (r - 1) * 24); // 超重：金線沉到海面下
}

const SKY_LABEL = {
  harbor: '平靜的港口',
  storm: '暴風雨中',
  dark: '一片漆黑、只有雨',
  night: '夜裡，雲縫裡有月光',
  dawn: '天亮了，遠方有海灣和沙灘',
};

/**
 * 主場景。
 * @param {{sky?: string, onDeck?: string[], afloat?: string[], justThrown?: string[], justRescued?: string[],
 *          load?: {weight:number, cap:number}, rock?: 'calm'|'storm'}} opts
 */
function scene(opts = {}) {
  const sky = SKY_LABEL[opts.sky] ? opts.sky : 'storm';
  const rock = opts.rock === 'calm' || opts.rock === 'storm' ? opts.rock : sky === 'harbor' ? 'calm' : 'storm';
  const has = (arr) => new Set(Array.isArray(arr) ? arr : []);
  const deckSet = has(opts.onDeck);
  const thrownSet = has(opts.justThrown);
  const rescuedSet = has(opts.justRescued);
  const onDeck = ITEM_ORDER.filter((id) => deckSet.has(id));
  const floatSet = has([...(opts.afloat || []), ...thrownSet]);
  const afloat = ITEM_ORDER.filter((id) => floatSet.has(id) && !deckSet.has(id));
  const load = opts.load || {};
  const weight = Number(load.weight) || 0;
  const cap = Number(load.cap) > 0 ? Number(load.cap) : 6;
  const over = weight > cap;
  const dy = draftOffset(weight, cap);
  const amp = rock === 'storm' ? 6 : 2.5;

  // 無障礙說明
  const parts = [SKY_LABEL[sky]];
  parts.push(onDeck.length ? `甲板上有${onDeck.join('、')}` : '甲板上空了');
  if (afloat.length) parts.push(`海上漂著${afloat.join('、')}`);
  parts.push(over ? `超重：載重 ${weight}／${cap}，船吃水過深、海水打上甲板` : `載重 ${weight}／${cap}，吃水線以內`);
  const label = parts.join('；');

  const cls = `art-scene scene sky-${sky} ${over ? 'is-over' : 'is-safe'}`;
  let s = `<svg xmlns="http://www.w3.org/2000/svg" class="art ${cls}" viewBox="0 0 360 190" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(label)}" data-weight="${weight}" data-cap="${cap}">`;
  s += `<g class="sky">${skyArt(sky)}</g>`;
  if (sky === 'storm') s += lightningBolt(250, 20, 1.2, 'lightning');

  // 後方的浪
  const backCol = { harbor: '#4f8fbf', storm: '#2c4767', dark: '#0b1424', night: '#1c3459', dawn: '#5d8db8' }[sky];
  const frontCol = { harbor: '#2d78ad', storm: C.seaDark, dark: '#0a1220', night: '#16304f', dawn: '#3f78a6' }[sky];
  const foamOp = sky === 'dark' ? 0.25 : 0.7;
  s += `<g class="waves waves-back"><path d="${wavePath(SEA - 6, amp * 0.6, 48, -96, 456, 190)}" fill="${backCol}"/></g>`;

  // 船（外層負責吃水，內層負責搖擺）
  s += `<g class="ship-draft" transform="translate(0 ${dy.toFixed(1)})"><g class="ship rock-${rock}">`;
  s += shipHull();
  s += safeLine();
  s += mastAndSail(sky);
  s += onDeck.map((id) => deckItem(id, dy, rescuedSet.has(id))).join('');
  if (over) {
    // 海水打上甲板
    s += `<g class="deck-water"><path d="M94 100 Q108 90 124 98 Q140 92 156 100 Z M206 100 Q222 91 238 98 Q252 92 268 100 Z" fill="#6fb6e8" opacity="0.85"/>` +
      `<path d="M100 92 l-3 -6 M116 90 l0 -7 M232 90 l0 -7 M248 92 l3 -6" stroke="${C.foam}" stroke-width="2" stroke-linecap="round"/></g>`;
  }
  s += `</g></g>`;

  // 前方的海（半透明，沉到水下的金線還隱約看得到）
  s += `<g class="waves waves-front"><path d="${wavePath(SEA, amp, 60, -120, 480, 190)}" fill="${frontCol}" opacity="0.88"/>` +
    `<path d="${wavePath(SEA, amp, 60, -120, 480)}" fill="none" stroke="${C.foam}" stroke-width="1.4" opacity="${foamOp}"/>` +
    `<path d="${wavePath(SEA + 22, amp * 0.6, 40, -120, 480)}" fill="none" stroke="${C.foam}" stroke-width="1" opacity="${foamOp * 0.5}"/></g>`;

  if (sky === 'night') {
    // 月光倒影
    s += `<g class="moonlight" opacity="0.5"><path d="M276 138 h28 M280 146 h20 M272 154 h34 M282 162 h16" stroke="#f3eed8" stroke-width="1.6" stroke-linecap="round"/></g>`;
  }

  if (over) {
    // 超重警告：紅色虛線吃水線＋三角驚嘆號（形狀＋顏色）
    s += `<g class="overload-warn">` +
      `<path d="M86 ${SEA - 2} L292 ${SEA - 2}" stroke="${C.red}" stroke-width="2.4" stroke-dasharray="7 4"/>` +
      `<path d="M318 92 L334 120 L302 120 Z" fill="${C.red}" stroke="#3a0b0b" stroke-width="1.6" stroke-linejoin="round"/>` +
      `<path d="M318 101 V111" stroke="#3a0b0b" stroke-width="3" stroke-linecap="round"/><circle cx="318" cy="115.5" r="1.7" fill="#3a0b0b"/>` +
      `</g>`;
  }

  s += afloat.map((id) => floatItem(id, dy, thrownSet.has(id))).join('');

  if (sky === 'storm') s += rain(360, 190, '#cfd8ff', 0.45);
  if (sky === 'dark') s += rain(360, 190, '#8a9abb', 0.35);
  s += `</svg>`;
  return s;
}

// ───────────────────────── 8. 吃飯（擘餅）動畫 ─────────────────────────

/** 約 2.5 秒：一雙手擘開餅、碎屑、周圍一圈人亮起來（27:35–36）。結尾停在靜態畫面。 */
function meal() {
  const n = 10;
  let heads = '';
  for (let i = 0; i < n; i++) {
    const ang = (i / n) * Math.PI * 2 - Math.PI / 2;
    const x = 120 + Math.cos(ang) * 96;
    const y = 82 + Math.sin(ang) * 56;
    heads += `<g class="meal-head" style="animation-delay:${(1.2 + i * 0.1).toFixed(2)}s">${bust(x.toFixed(1), (y - 6).toFixed(1), 7, C.gold2)}</g>`;
  }
  const crumbs = [
    [-12, -28],
    [-3, -36],
    [9, -32],
    [17, -24],
    [-4, 22],
    [6, 26],
    [0, 34],
  ]
    .map(
      ([x, y], i) =>
        `<g class="meal-crumb" style="--cx:${-x}px;--cy:${-y}px;animation-delay:${(0.8 + i * 0.05).toFixed(2)}s"><circle cx="${120 + x}" cy="${78 + y}" r="${i % 2 ? 1.6 : 2.2}" fill="#f0bd6c" stroke="${C.ink}" stroke-width="0.6"/></g>`,
    )
    .join('');
  // 半個餅（左半），右半用鏡像
  const half = (side) => {
    const m = side === 'L' ? '' : ' transform="translate(240 0) scale(-1 1)"';
    return (
      `<g${m}><path d="M117 64 Q92 62 90 79 Q92 95 117 94 L113 89 L118 85 L113 80 L118 75 L113 70 Z" fill="${C.bread}" ${INK}/>` +
      `<path d="M113 89 L118 85 L113 80 L118 75 L113 70 L109 72 L111 79 L108 86 Z" fill="#f6e3b8"/>` +
      `<path d="M96 74 Q101 67 109 66" fill="none" stroke="#f6cf86" stroke-width="2.4" stroke-linecap="round"/></g>`
    );
  };
  const hand = (side) => {
    const m = side === 'L' ? '' : ' transform="translate(240 0) scale(-1 1)"';
    return `<g${m}><path d="M74 124 Q82 100 94 90 Q102 86 110 88 Q114 92 108 95 L102 96 Q98 106 92 126 Z" fill="#e9d2b0" ${INK}/>` +
      `<path d="M96 92 q2 -3 6 -3 M100 94 q2 -3 6 -3" fill="none" stroke="${C.ink}" stroke-width="1"/></g>`;
  };
  return (
    `<svg xmlns="http://www.w3.org/2000/svg" class="art art-meal" viewBox="0 0 240 160" width="100%" role="img" aria-label="保羅拿著餅擘開，大家都放下心，也吃了（使徒行傳 27:35–36）">` +
    `<ellipse cx="120" cy="82" rx="112" ry="72" fill="${C.card}"/>` +
    `<ellipse cx="120" cy="82" rx="70" ry="40" fill="${C.card2}"/>` +
    heads +
    `<g class="meal-hands">` +
    `<g class="meal-half meal-half-l">${half('L')}${hand('L')}</g>` +
    `<g class="meal-half meal-half-r">${half('R')}${hand('R')}</g>` +
    `</g>` +
    crumbs +
    `</svg>`
  );
}

// ───────────────────────── 9. 上岸動畫 ─────────────────────────

/**
 * 約 4 秒：天亮的海灣 → 船駛向沙灘 → 兩水夾流擱淺、船尾被浪打壞 → 有的游、有的抱木板上岸 → 岸上生火。
 * 每個人都會上岸（27:44）。lit 只改細節。
 * @param {{lit?: {力氣?: boolean, 船身?: boolean, 天亮?: boolean}}} [opt]
 */
function landing({ lit = {} } = {}) {
  const strong = !!lit['力氣'];
  const hullOk = !!lit['船身'];
  const daylight = !!lit['天亮'];
  const g = uid('land');
  const sea = uid('landsea');

  // 天空：天亮＝true 時較明亮
  const skyTop = daylight ? '#7e93c4' : '#4a4f7e';
  const skyLow = daylight ? '#ffc58f' : '#d98f78';
  let s = `<svg xmlns="http://www.w3.org/2000/svg" class="art art-landing${strong ? '' : ' is-weak'}" viewBox="0 0 360 200" width="100%" role="img" aria-label="天亮時船駛向海灘，在兩水夾流的地方擱淺，船尾被浪打壞；大家有的游水、有的抱著木板，全都上了岸，岸上生起了火（使徒行傳 27:39–44、28:2）">`;
  s += `<defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${skyTop}"/><stop offset="1" stop-color="${skyLow}"/></linearGradient>` +
    `<linearGradient id="${sea}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f86b4"/><stop offset="1" stop-color="#22557f"/></linearGradient></defs>`;
  s += `<rect width="360" height="112" fill="url(#${g})"/>`;
  s += `<circle cx="300" cy="${daylight ? 104 : 112}" r="16" fill="#ffe7a8"/><circle cx="300" cy="${daylight ? 104 : 112}" r="28" fill="#ffe7a8" opacity="0.25"/>`;
  // 遠方岬角
  s += `<path d="M-10 112 L-10 96 Q30 86 60 98 Q90 92 110 112 Z" fill="#5e7a6b"/>`;
  s += `<path d="M300 112 Q330 90 370 94 L370 112 Z" fill="#5e7a6b"/>`;
  // 海
  s += `<rect y="112" width="360" height="88" fill="url(#${sea})"/>`;
  s += `<g class="waves waves-landing"><path d="${wavePath(126, 1.6, 30, -60, 420)} ${wavePath(146, 1.8, 36, -60, 420).replace('M', 'M')}" fill="none" stroke="${C.foam}" stroke-width="1" opacity="0.5"/></g>`;
  // 沙灘
  s += `<path d="M232 200 L246 152 Q276 128 360 120 L360 200 Z" fill="${C.sand}" stroke="#c9a96a" stroke-width="1.2"/>`;
  s += `<path d="M246 152 Q276 128 360 120" fill="none" stroke="${C.foam}" stroke-width="2" opacity="0.8"/>`;
  // 兩水夾流：兩股水流在沙洲匯合
  s += `<g class="currents" opacity="0.85">` +
    `<path d="M150 128 Q190 136 222 150" fill="none" stroke="${C.foam}" stroke-width="1.6" stroke-dasharray="5 4"/>` +
    `<path d="M150 190 Q192 176 222 158" fill="none" stroke="${C.foam}" stroke-width="1.6" stroke-dasharray="5 4"/>` +
    `<path d="M216 146 l7 4 l-7 3 M216 162 l7 -4 l-1 7" fill="none" stroke="${C.foam}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>` +
    `<ellipse cx="226" cy="156" rx="16" ry="4" fill="#d9c08a" opacity="0.8"/>` +
    `</g>`;
  if (!daylight) {
    // 天還不夠亮：沙洲旁露出幾塊礁石
    s += `<path d="M196 170 l6 -8 l7 3 l4 5 Z M180 158 l4 -6 l5 3 l2 3 Z" fill="#3f4658" stroke="#262b38" stroke-width="1"/>`;
  }

  // 船：最終停在沙洲，船頭卡住、船尾已碎
  const brokenHull = hullOk
    ? `M130 136 L138 140 L214 140 L232 128 Q228 152 206 160 L148 160 L142 154 L146 150 L140 146 L136 142 Z`
    : `M150 140 L214 140 L232 128 Q228 152 206 160 L166 160 L160 152 L166 148 L156 146 L162 142 Z`;
  const sternPiece = hullOk
    ? `M120 128 L130 136 L136 142 L140 146 L146 150 L142 154 L148 160 Q124 158 120 128 Z`
    : `M120 128 L138 140 L150 140 L162 142 L156 146 L166 148 L160 152 L166 160 L148 160 Q124 158 120 128 Z`;
  s += `<g class="land-ship-wrap"><g class="land-ship">` +
    `<g class="stern-intact" opacity="0"><path d="${sternPiece}" fill="${C.wood}" ${INK}/></g>` +
    `<path d="${brokenHull}" fill="${C.wood}" ${INK}/>` +
    `<path d="M140 150 Q190 152 226 140" fill="none" stroke="${C.woodDark}" stroke-width="1.2"/>` +
    ol('M182 140 L182 82', C.woodLight, 2.4) +
    `<path d="M184 86 L184 120 L210 120 Z" fill="${C.sail}" ${INK}/>` +
    `</g></g>`;

  // 碎木板（船尾被浪打壞）
  const debris = hullOk
    ? [
        [118, 170, 20],
        [104, 156, -15],
        [130, 184, 8],
      ]
    : [
        [118, 170, 20],
        [104, 156, -15],
        [130, 184, 8],
        [92, 176, 35],
        [140, 194, -25],
        [86, 148, 5],
      ];
  s += debris
    .map(
      ([x, y, r], i) =>
        `<g transform="translate(${x} ${y})"><g class="land-debris" style="--dx:${(136 - x).toFixed(0)}px;--dy:${(148 - y).toFixed(0)}px;animation-delay:${(i * 0.05).toFixed(2)}s"><rect x="-9" y="-2" width="18" height="4" rx="1" transform="rotate(${r})" fill="${C.woodLight}" ${INK}/></g></g>`,
    )
    .join('');
  // 浪打船尾的水花
  s += splashArt(132, 146, 'land-splash');

  // 火（28:2）
  s += `<g transform="translate(304 180)"><g class="land-fire">` +
    `<path d="M-12 4 L12 -2 M-12 -2 L12 4" stroke="${C.woodDark}" stroke-width="4" stroke-linecap="round"/>` +
    `<g class="flame"><path d="M0 -26 Q12 -12 8 -2 Q4 4 0 4 Q-4 4 -8 -2 Q-12 -12 0 -26 Z" fill="#ff8a3d" ${INK}/>` +
    `<path d="M0 -15 Q6 -8 4 -2 Q0 2 -4 -2 Q-6 -8 0 -15 Z" fill="${C.gold2}"/></g>` +
    `</g></g>`;

  // 人：最終都站在岸上圍著火；起點在船旁的水裡
  const people = [
    [262, 160, 206, 172, true],
    [276, 176, 214, 184, false],
    [286, 192, 196, 192, true],
    [326, 192, 230, 192, false],
    [338, 176, 182, 178, true],
    [344, 158, 238, 174, false],
    [284, 146, 244, 160, false],
    [322, 150, 222, 168, true],
  ];
  s += people
    .map(([fx, fy, sx, sy, plank], i) => {
      const plankSvg = plank ? `<rect x="3" y="-18" width="4" height="20" rx="1" fill="${C.woodLight}" ${INK}/>` : '';
      const color = i % 2 ? '#22324f' : '#2e2a3f';
      return (
        `<g transform="translate(${fx} ${fy})" stroke="${C.text}" stroke-width="0.8"><g class="land-person${strong ? '' : ' slow'}" style="--sx:${sx - fx}px;--sy:${sy - fy}px;animation-delay:${(i * 0.06).toFixed(2)}s">` +
        plankSvg +
        person(0, 0, 20, color) +
        `</g></g>`
      );
    })
    .join('');
  s += `</svg>`;
  return s;
}

/** 小的水花圖（獨立使用，會播一次動畫）。 */

// ───────────────────────── 10. 拋錨、捆船底（天亮前只來得及做一件） ─────────────────────────

/** 約 2 秒：船尾放下四個錨，繩子拉直、沉進夜海（27:29）。靜止時就是錨已沉在水裡。 */
function anchorDrop() {
  const anchors = [0, 1, 2, 3]
    .map((i) => {
      const x = 52 + i * 14;
      return (
        `<g class="ad-rope" style="animation-delay:${(0.2 + i * 0.15).toFixed(2)}s">${ol(`M${x} 64 L${x} 118`, C.rope, 1.6)}</g>` +
        `<g class="ad-anchor" style="animation-delay:${(0.2 + i * 0.15).toFixed(2)}s"><g transform="translate(${x - 9} 112) scale(0.45)">${anchorShape(C.steel, 3.4)}</g></g>`
      );
    })
    .join('');
  return (
    svgOpen({ viewBox: '0 0 240 160', label: '從船尾拋下四個錨，盼望天亮（使徒行傳 27:29）', cls: 'art-use art-anchor' }) +
    `<rect width="240" height="160" rx="16" fill="${C.navy}"/>` +
    `<circle cx="200" cy="28" r="10" fill="${C.sail}" opacity="0.85"/>` +
    `<path d="M0 80 Q30 74 60 80 T120 80 T180 80 T240 80 V160 H0 Z" fill="${C.seaDark}"/>` +
    anchors +
    `<path d="M30 66 L40 52 L200 52 L214 66 Q200 82 170 86 L66 86 Q40 84 30 66 Z" fill="${C.wood}" ${INK}/>` +
    `<path d="M0 82 Q30 76 60 82 T120 82 T180 82 T240 82" fill="none" stroke="${C.foam}" stroke-width="1.6" opacity="0.7"/>` +
    `</svg>`
  );
}

/** 約 2 秒：繩子一圈一圈繞過船底、拉緊（27:17）。靜止時就是船底已捆好。 */
function undergird() {
  const loops = [0, 1, 2]
    .map((i) => {
      const x = 84 + i * 36;
      return `<g class="ug-loop" style="animation-delay:${(0.2 + i * 0.3).toFixed(2)}s">${ol(`M${x} 48 Q${x - 8} 92 ${x} 112 Q${x + 8} 92 ${x + 2} 48`, C.rope, 2.4)}</g>`;
    })
    .join('');
  return (
    svgOpen({ viewBox: '0 0 240 160', label: '用繩子捆綁船底（使徒行傳 27:17）', cls: 'art-use art-undergird' }) +
    `<rect width="240" height="160" rx="16" fill="${C.navy}"/>` +
    `<path d="M0 104 Q30 98 60 104 T120 104 T180 104 T240 104 V160 H0 Z" fill="${C.seaDark}"/>` +
    `<path d="M36 52 L48 40 L196 40 L210 52 Q198 106 160 112 L82 112 Q46 106 36 52 Z" fill="${C.wood}" ${INK}/>` +
    `<path d="M50 70 Q122 78 200 66 M58 92 Q122 100 190 88" fill="none" stroke="${C.woodDark}" stroke-width="1.4"/>` +
    loops +
    `</svg>`
  );
}

return { item, need, role, pref, scene, darkness, meal, landing };

  { grp: '新流程', t: '夜裡：離天亮', fix: [4, 2], note: ['頂端一直是「🌅 離天亮還有」同一個倒數；夜裡多一條天色條，太陽慢慢走到日出。', '「等天亮」改名「錨住船」；「天亮前只來得及一件」改「出發前」。（見待決定 2）', '醫生的任務讓他在全員同意時有份量。'], was: '只有月亮，沒有天快亮的過程。',
    r: () => {
      const T = { comms: '先問大家：「現在吃飯好嗎？」大家點頭，就按下面的按鈕。', supply: '浪更大了，船只能留 5：再決定一次留什麼。', nav: '大家都準備好了，就由你按「衝向海灘」。', medic: '你有新線索：十四天沒吃東西了（27:33）。去跟 <em>阿明（🍲伙房）</em> 說：現在就該召集大家吃飯。伙房一按，每個人手機都會跳出「同意／等一下」，<em>大家會先看你怎麼說</em>。' };

  { grp: '新流程', t: '開飯：帶來的東西出場', fix: [5], note: ['不出「你最想吃什麼」的題目。改由故事點名隊友：「美玲 把帶來的乾果分給大家」——被點到的人會笑、會被追問，話題自然來。', '經文裡這正是大家「放下心」的一刻（27:36）。'], was: '上一版原型跳出「跟旁邊的人說：你現在最想吃什麼？」，太像出題。',

  { grp: '新流程', t: '天亮，衝向海灘', fix: [4], note: ['和故事動畫第三格同一張圖，一看就知道「終點到了」。結算標題等動畫播完才出現。'], was: '動畫後面先透出結算標題。',
    r: () => `<div class="full">${A.landing({ lit: { 力氣: true, 船身: true, 天亮: true } })}<h2>天亮了，衝向海灘！</h2><cite>徒 27:39–41</cite><button class="big" data-go="next">上岸</button></div>` },
  { grp: '新流程', t: '火堆旁（結算）', fix: [5], note: ['經文 28:1–2：上岸那天下雨又冷，島上的人生火接待他們——結算就畫成大家圍著火。', '「剛才發生的事」用<b>真實紀錄點名每個人</b>：誰丟了什麼、誰喊了等一下、第 2 格誰形容誰選對、誰召集吃飯。人最愛聊剛剛一起經歷的事：「你剛才到底怎麼形容的？」——不用出題就聊起來。', '帶來的東西最後出場（外衣、一首歌）。', '謝謝誰＋原因（可跳過、不計分）。', '拿掉「船員回憶」和小問題題庫。'], was: '結尾只有一行灰字「隨口聊聊：剛才哪一刻你最緊張？」；上一版原型是「船員回憶」要大家回想別人的答案，太像考試。',
    r: () => `<div class="tb"><div class="me"><b>全船平安上岸</b></div><div style="display:flex;gap:6px">${['力氣', '船身', '天亮'].map((k) => A.need(k, true, 26)).join('')}</div></div><div class="body">
      ${campfire()}
      <div style="text-align:center;font-size:13px;color:var(--muted)">那天下雨又冷，島上的人生了火接待大家（徒 28:1–2）。經文裡，船上 276 人全都上了岸。</div>

      <details class="sec"><summary>想謝謝誰嗎？ <span class="r">點一下名字就好 ▾</span></summary><div class="in"><div class="chips">${CREW.filter((x) => x.n !== view.n).map((x) => `<button>♡ ${x.n}</button>`).join('')}</div></div></details>
      <button class="big" data-go="next">再來一局（換角色）</button></div>` },
  { grp: '新流程', t: '第二局：換角色交接', fix: [3, 5], note: ['第二局角色會輪替（程式本來就這樣）。角色卡多一行「上一局的伙房是 阿明——卡住可以問他」。', '上一局的人變成「前輩」，大家<b>自然和不同的人說話</b>；任務條也會派到新搭檔。這是第二局最自然的破冰。', '第二局不再播動畫，角色卡 8 秒。'], was: '第二局角色換了，但沒有任何提示；常常還是跟同一兩個人說話。',
    r: () => {
      const prev = { comms: '大衛', supply: '阿明', nav: '小芳', medic: '佳慧', combo: '阿明' }[view.id];
      return roleCard(false, `<div class="body"><div class="looking">🔁 上一局的${R[main()].name}是 <b>${prev}</b>——卡住可以問他。</div></div><div class="bar"><div class="pbar"><i style="animation-duration:8s"></i></div><button class="big">好，開船</button></div>`);
    } },
  // ───── 待決定（A／B 並排）─────
  { grp: '待決定（看畫面選）', t: '決定 1：角色登場放哪裡', compare: true, fix: [1, 3], note: ['<b>方案 A</b>：按開始後先不計時：角色卡 8 秒＋30 秒動畫，看完才開始 8 分鐘。新人有時間搞懂；第一局多約 40 秒。', '<b>方案 B</b>：按開始就計時；角色卡疊在開局畫面上 8 秒，動畫縮成一張「三件事」說明卡放在大廳。不增加時間，但新人邊跑邊學。', '兩案都<b>沒有</b>輪流自我介紹。用上方「方案 A／B」切換。'], was: '現在：按開始就計時，第一個畫面是起風卡經文。',
    r: () => opt === 'A'
      ? `<div class="full"><div class="optlbl">方案 A・不計時</div>${A.role(main(), 72)}<h2>${roleNames()}</h2><p>角色卡 8 秒 → 30 秒動畫（起風／天黑／天亮）</p><div class="three"><div>${A.scene({ sky: 'storm', onDeck: ALL, load: { weight: 15, cap: 8 } }).replace('width="100%"', 'width="96"')}起風</div><div style="width:96px;height:51px;overflow:hidden;border-radius:6px">${A.darkness()}天黑</div><div>${A.landing({ lit: { 力氣: true, 船身: true, 天亮: true } }).replace('width="100%"', 'width="96"')}天亮</div></div><p style="font-size:15px;color:var(--muted)">看完才開始 8 分鐘倒數</p><button class="big">開船（開始 8:00）</button></div>`
      : `${topbar('<small>🌅 離天亮還有</small>7:58', '🌬 風暴 2:43 後來')}<div class="body" style="position:relative"><div class="optlbl">方案 B・直接開始</div><div style="opacity:.35">${intel()}${shipStatus(false)}</div><div style="position:absolute;inset:30px 0 auto 0">${roleCard(false, '')}</div></div>` },
  { grp: '待決定（看畫面選）', t: '決定 2：「天亮」怎麼說', compare: true, fix: [4], note: ['<b>方案 A</b>：倒數一直叫「離天亮」、夜裡有天色條；三件事的「等天亮」改名「錨住船」；「天亮前只來得及一件」改「出發前」。「天亮」只剩一個意思＝衝向海灘的時刻。', '<b>方案 B</b>：名稱不動（等天亮、天亮前只來得及一件），只加「離天亮」倒數和天色條。改動最少，但「等天亮」和「天亮」還是兩個意思。'], was: '現在：倒數是抽象的 8:00；「天亮」同時是要顧的事、期限、出發時刻。',
    r: () => { dawnNew = opt === 'A'; const h = `${topbar('<small>🌅 離天亮還有</small>3:20', '🌙 補好船了')}<div class="skybar"><i></i></div><div class="skycap"><span>🌙 第十四天夜裡</span><span>🌅 天亮＝衝向海灘</span></div><div class="body"><div class="optlbl">方案 ${opt}</div><div class="use"><div class="rule">${opt === 'A' ? '出發前' : '天亮前'}，全隊只來得及做<b>一件</b>（吃飯也算）</div><button class="big">🍞 召集大家吃飯</button></div><div class="sec"><div class="in" style="padding-top:12px">${gauge(8, 5)}<div class="needs"><div class="h">上岸要顧好的三件事</div><div class="row">${['力氣', '船身', '天亮'].map((k) => `<div>${A.need(k, k !== '力氣', 34)}<span>${nm(k)}</span><small>${k === '天亮' ? (opt === 'A' ? '撐到天亮' : '留著錨') : k === '力氣' ? '要吃了才算' : '靠纜索'}</small></div>`).join('')}</div></div></div></div></div>`; dawnNew = true; return h; } },
  { grp: '待決定（看畫面選）', t: '決定 3：角色卡加聖經人物', compare: true, fix: [3], note: ['<b>方案 A</b>：角色卡多一行「故事裡：掌船的（徒 27:11）」「路加醫生（西 4:14）」「水手（徒 27:27–30）」；其他角色寫「船上的人」。好記、順便學聖經；不扮演保羅。', '<b>方案 B</b>：只寫職能，不提人物。字少一行，比較不像在教聖經。', '用上方角色切換看不同角色（醫生最明顯）。'], was: '現在：角色只有職能名，沒有任何說明。',
    r: () => roleCard(opt === 'A', `<div class="body"><div class="optlbl">方案 ${opt}</div></div>`) },
];

const whoEl = document.getElementById('who');
const stepsEl = document.getElementById('steps');
const scr = document.getElementById('scr');
const notes = document.getElementById('notes');
const PROBLEM = { 1: '問題 1 看不懂', 2: '問題 2 資訊太多', 3: '問題 3 角色', 4: '問題 4 天亮', 5: '問題 5 破冰' };

function render() {
  timers.forEach(clearTimeout); timers = [];
  whoEl.innerHTML = VIEWS.map((v) => `<button data-view="${v.id}" aria-pressed="${v === view}">${v.label}</button>`).join('') + (STEPS[step].compare ? `<span style="width:100%"></span>${['A', 'B'].map((o) => `<button data-opt="${o}" aria-pressed="${opt === o}" class="optbtn">方案 ${o}</button>`).join('')}` : '');
  let g = '';
  stepsEl.innerHTML = STEPS.map((s, i) => { const h = s.grp !== g ? `<div class="grp">${(g = s.grp)}</div>` : ''; return `${h}<button data-step="${i}" aria-current="${i === step}"><b>${i + 1}</b>${s.t}</button>`; }).join('');
  const s = STEPS[step];
  scr.className = 'scr' + (STEPS[step].t.startsWith('天黑') ? ' dark' : '');
  scr.innerHTML = s.r();
  scr.scrollTop = 0;
  notes.innerHTML = `<h2>${step + 1}. ${s.t}</h2><div class="fix">${s.fix.map((f) => `<span>${PROBLEM[f]}</span>`).join('')}</div><ul>${s.note.map((n) => `<li>${n}</li>`).join('')}</ul><div class="was"><b>現在的遊戲：</b>${s.was}</div>`;
  const hold = document.getElementById('hold');
  if (hold) {
    const show = () => { hold.innerHTML = '<svg viewBox="0 0 60 60" width="110" height="110" aria-label="記號：一個圓，右上缺兩個口"><path d="M30 6 A24 24 0 1 0 54 30" fill="none" stroke="#ffd97a" stroke-width="6" stroke-dasharray="60 8 140 0"/><circle cx="30" cy="30" r="6" fill="#ffd97a"/></svg>'; };
    const hide = () => { hold.textContent = '按住這裡才會顯示記號'; };
    hold.addEventListener('pointerdown', show); hold.addEventListener('pointerup', hide); hold.addEventListener('pointerleave', hide);
  }
}
function go(i) { step = Math.max(0, Math.min(STEPS.length - 1, i)); sub = 0; render(); }
document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.opt) { opt = b.dataset.opt; render(); }
  else if (b.dataset.view) { view = VIEWS.find((v) => v.id === b.dataset.view); sub = 0; render(); }
  else if (b.dataset.step) go(+b.dataset.step);
  else if (b.dataset.go === 'next' || b.id === 'next') go(step + 1);
  else if (b.id === 'prev') go(step - 1);
    else if (b.closest('.full[data-sub]')) { sub++; render(); }
});
const q = new URLSearchParams(location.search);
if (location.hash.startsWith('#s')) step = Math.min(STEPS.length - 1, Math.max(0, parseInt(location.hash.slice(2), 10) - 1 || 0));
if (q.get('v')) view = VIEWS.find((v) => v.id === q.get('v')) || view;
render();
</script>
